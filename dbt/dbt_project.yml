name: doorsignal
version: "0.4.0"
config-version: 2
profile: doorsignal
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  doorsignal:
    +materialized: view
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
      +materialized: table
    signals:
      +schema: signals
      +materialized: table
    risk:
      +schema: risk
      +materialized: table
    serving:
      +schema: serving
      +materialized: table

seeds:
  doorsignal:
    +schema: signals
    risk_register_input:
      +schema: risk
    risk_scenarios:
      +schema: risk
    org_map:
      +schema: ops

vars:
  as_of_date: "2026-10-31"
  s02_min_baseline: 20
  s08_min_recent: 5
  s08_min_baseline: 10
  risk_pd_horizon_days: 90
  risk_lookback_days: 180
  risk_min_bucket_n: 30

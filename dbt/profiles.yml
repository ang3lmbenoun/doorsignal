doorsignal:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST') }}"
      port: "{{ env_var('PGPORT', '5432') | as_number }}"
      user: "{{ env_var('PGUSER') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE') }}"
      schema: staging
      sslmode: "{{ env_var('PGSSLMODE', 'require') }}"
      threads: 4
      connect_timeout: 15
      keepalives_idle: 30
      retries: 2

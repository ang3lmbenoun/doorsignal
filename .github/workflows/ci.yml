name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: dbt parse (no database needed)
        env:
          PGHOST: localhost
          PGUSER: ci
          PGPASSWORD: ci
          PGDATABASE: ci
        run: dbt parse --project-dir dbt --profiles-dir dbt

  database:
    runs-on: ubuntu-latest
    needs: checks
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Neon connection (skips if secret is not set)
        run: python -m ingest.check_connection --skip-if-unset

  api-leaks:
    # M5a leak matrix against a Neon BRANCH (never main). Secrets are scoped to the steps that need them.
    # Skips cleanly when NEON_CI_DATABASE_URL is unset, except on main, where a skip fails the run: a green
    # run with no isolation test is not allowed to look like a pass.
    runs-on: ubuntu-latest
    needs: checks
    concurrency:
      group: api-leaks-neon-ci-branch   # one run at a time: they share one Neon branch
      cancel-in-progress: false
    env:
      HAS_CI_DB: ${{ secrets.NEON_CI_DATABASE_URL != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CI_DB != 'true'
        run: |
          echo "NEON_CI_DATABASE_URL is not set; no API isolation test ran."
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then echo "Failing: main must run the leak tests."; exit 1; fi
      - uses: actions/checkout@v4
        if: env.HAS_CI_DB == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_CI_DB == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        if: env.HAS_CI_DB == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install (no secrets in this step)
        if: env.HAS_CI_DB == 'true'
        run: |
          pip install -r requirements-dev.txt
          npm ci --prefix api
      - name: npm audit (production dependencies)
        if: env.HAS_CI_DB == 'true'
        run: npm audit --omit=dev --prefix api
      - name: API roles and password on the CI branch
        # DATABASE_URL here is main, only so the never-main guard in ingest.api_sql can compare against it.
        if: env.HAS_CI_DB == 'true'
        env:
          NEON_CI_DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
          API_LOGIN_PASSWORD: ${{ secrets.API_LOGIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m ingest.api_sql roles --url-env NEON_CI_DATABASE_URL
          python -m ingest.api_sql password --url-env NEON_CI_DATABASE_URL
      - name: Build serving layer on the CI branch
        if: env.HAS_CI_DB == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
        run: python -m ingest.run_dbt build --select org_map path:models/serving
      - name: Leak tests
        if: env.HAS_CI_DB == 'true'
        env:
          NEON_CI_DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
          API_LOGIN_PASSWORD: ${{ secrets.API_LOGIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run test:leaks --prefix api

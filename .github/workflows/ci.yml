name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: dbt parse (no database needed)
        env:
          PGHOST: localhost
          PGUSER: ci
          PGPASSWORD: ci
          PGDATABASE: ci
        run: dbt parse --project-dir dbt --profiles-dir dbt

  database:
    runs-on: ubuntu-latest
    needs: checks
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Neon connection (skips if secret is not set)
        run: python -m ingest.check_connection --skip-if-unset

  api-leaks:
    # M5a leak matrix against a Neon BRANCH (never main). Skips cleanly when NEON_CI_DATABASE_URL is unset.
    runs-on: ubuntu-latest
    needs: checks
    env:
      NEON_CI_DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
      API_LOGIN_PASSWORD: ${{ secrets.API_LOGIN_PASSWORD }}
    steps:
      - name: Skip notice
        if: env.NEON_CI_DATABASE_URL == ''
        run: echo "NEON_CI_DATABASE_URL is not set; skipping the API leak tests."
      - uses: actions/checkout@v4
        if: env.NEON_CI_DATABASE_URL != ''
      - uses: actions/setup-python@v5
        if: env.NEON_CI_DATABASE_URL != ''
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        if: env.NEON_CI_DATABASE_URL != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        if: env.NEON_CI_DATABASE_URL != ''
        run: |
          pip install -r requirements-dev.txt
          npm ci --prefix api
      - name: npm audit (production dependencies)
        if: env.NEON_CI_DATABASE_URL != ''
        run: npm audit --omit=dev --prefix api
      - name: API roles and password on the CI branch
        if: env.NEON_CI_DATABASE_URL != ''
        run: |
          python -m ingest.api_sql roles --url-env NEON_CI_DATABASE_URL
          python -m ingest.api_sql password --url-env NEON_CI_DATABASE_URL
      - name: Build serving layer on the CI branch
        if: env.NEON_CI_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
        run: python -m ingest.run_dbt build --select org_map path:models/serving
      - name: Leak tests
        if: env.NEON_CI_DATABASE_URL != ''
        run: npm run test:leaks --prefix api

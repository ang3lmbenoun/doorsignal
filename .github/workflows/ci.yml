name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: dbt parse (no database needed)
        env:
          PGHOST: localhost
          PGUSER: ci
          PGPASSWORD: ci
          PGDATABASE: ci
        run: dbt parse --project-dir dbt --profiles-dir dbt

  database:
    runs-on: ubuntu-latest
    needs: checks
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Neon connection (skips if secret is not set)
        run: python -m ingest.check_connection --skip-if-unset

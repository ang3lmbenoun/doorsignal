name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: dbt parse (no database needed)
        env:
          PGHOST: localhost
          PGUSER: ci
          PGPASSWORD: ci
          PGDATABASE: ci
        run: dbt parse --project-dir dbt --profiles-dir dbt

  database:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Neon connection (skips if secret is not set)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m ingest.check_connection --skip-if-unset

  api-leaks:
    # M5a/M5b API tests against the Neon branch behind NEON_CI_DATABASE_URL (the api-ci branch, never main).
    # The job rebuilds that branch from scratch (raw load + full dbt chain), so it does not depend on what the
    # branch already contains. Secrets are scoped to the steps that need them.
    # Skips cleanly when NEON_CI_DATABASE_URL is unset, except on main, where a skip fails the run: a green
    # run with no isolation test is not allowed to look like a pass.
    runs-on: ubuntu-latest
    needs: checks
    concurrency:
      group: api-leaks-neon-ci-branch   # one run at a time: they share one Neon branch
      cancel-in-progress: false
    env:
      HAS_CI_DB: ${{ secrets.NEON_CI_DATABASE_URL != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CI_DB != 'true'
        run: |
          echo "NEON_CI_DATABASE_URL is not set; no API isolation test ran."
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then echo "Failing: main must run the leak tests."; exit 1; fi
      - uses: actions/checkout@v4
        if: env.HAS_CI_DB == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_CI_DB == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        if: env.HAS_CI_DB == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install (no secrets in this step)
        if: env.HAS_CI_DB == 'true'
        run: |
          pip install -r requirements-dev.txt
          npm ci --prefix api
      - name: npm audit (production dependencies)
        if: env.HAS_CI_DB == 'true'
        run: npm audit --omit=dev --prefix api
      - name: Guard - the CI database must not be main
        # DATABASE_URL here is main, only so the guard in ingest.api_sql can compare hosts. Runs before anything
        # that writes: the steps below truncate and rebuild the CI branch.
        if: env.HAS_CI_DB == 'true'
        env:
          NEON_CI_DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m ingest.api_sql guard --url-env NEON_CI_DATABASE_URL
          # Later steps get only the main HOST (not a secret) to compare against, never the main credential.
          python -c "import os;from urllib.parse import urlparse;print('MAIN_DATABASE_HOST=' + (urlparse(os.environ['DATABASE_URL']).hostname or '').replace('-pooler',''))" >> "$GITHUB_ENV"
      - name: Load raw data on the CI branch (schemas, simulator seed, empty HUD reference table)
        # The branch does not need to contain anything beforehand: this rebuilds it from the committed seed.
        # The HUD xlsx is not in the repo, so rents fall back to the simulator multiplier (safmr_rent is null).
        if: env.HAS_CI_DB == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
        run: |
          python -m ingest.init_db --with-ref-tables
          python -m ingest.load_sim
      - name: API roles and passwords on the CI branch
        if: env.HAS_CI_DB == 'true'
        env:
          NEON_CI_DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
          API_LOGIN_PASSWORD: ${{ secrets.API_LOGIN_PASSWORD }}
          AGENT_WRITER_PASSWORD: ${{ secrets.AGENT_WRITER_PASSWORD }}
        run: |
          python -m ingest.api_sql roles --url-env NEON_CI_DATABASE_URL
          python -m ingest.api_sql ops --url-env NEON_CI_DATABASE_URL
          python -m ingest.api_sql password --url-env NEON_CI_DATABASE_URL
          python -m ingest.api_sql password --role api_agent_writer --url-env NEON_CI_DATABASE_URL
      - name: Full dbt build on the CI branch (staging to serving; re-applies serving RLS afterwards)
        if: env.HAS_CI_DB == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
        run: python -m ingest.run_dbt build
      - name: Leak, approval and agent tests
        if: env.HAS_CI_DB == 'true'
        env:
          NEON_CI_DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
          API_LOGIN_PASSWORD: ${{ secrets.API_LOGIN_PASSWORD }}
          AGENT_WRITER_PASSWORD: ${{ secrets.AGENT_WRITER_PASSWORD }}
        run: |
          # Agent tests use fake or recorded providers only: refuse to run if a live LLM key is in this environment.
          if env | grep -qE '^(NVIDIA|GOOGLE|OPENROUTER|ANTHROPIC|GROQ)_API_KEY=.+'; then echo 'LLM key present in the test environment'; exit 1; fi
          npm run test:leaks --prefix api
